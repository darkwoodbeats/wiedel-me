<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page { size: Letter; }
  /* The wiedel.me site's own faces, loaded from the site repo (licenses: components/hero/font-files/OFL.txt).
     md2html.py fills {{FONT_DIR}} with that folder's file:// URL, so the template works on any machine.
     Headings: Wiedel Display (Hubot Sans Expanded Black Italic). Body copy: Mona Sans (weights 200 to 900). */
  @font-face { font-family: "Wiedel Display"; font-weight: 900; font-style: italic;
    src: url("{{FONT_DIR}}/WiedelDisplay-BlackItalic.woff2") format("woff2"); }
  @font-face { font-family: "Mona Sans"; font-weight: 200 900; font-style: normal;
    src: url("{{FONT_DIR}}/MonaSans-Latin.woff2") format("woff2"); }
  :root {
    --ink: #1c1c1c; --muted: #555;
    --display: "Wiedel Display", "Arial Black", sans-serif;
    --sans: "Mona Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--sans); font-size: 10.5pt; line-height: 1.55; color: var(--ink);
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* The title and the secondary headings take the site's .heading treatment (display face, black italic,
     all caps). Section headings are Mona Sans ExtraBold, as typed, so long titles stay readable. */
  h1 { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase;
       text-wrap: balance; font-size: 22pt; line-height: 0.98; margin: 0 0 14pt 0; }
  h2 { font-family: var(--sans); font-weight: 800; font-size: 16pt; line-height: 1.2; letter-spacing: -0.01em;
       text-wrap: balance; margin: 20pt 0 8pt 0; }
  h3 { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase;
       font-size: 11pt; line-height: 1.1; margin: 16pt 0 6pt 0; }
  p { margin: 0 0 8pt 0; }
  strong { font-weight: 600; }
  ul { margin: 0 0 9pt 0; padding-left: 1.45em; }
  ol { margin: 0 0 9pt 0; padding-left: 1.8em; }
  li { margin: 0 0 4pt 0; padding-left: 0.15em; }
  li > ul, li > ol { margin: 3pt 0 0 0; }
  li > ul li { margin-bottom: 2pt; }

  /* Tables: near-black header row with white text; body in subtle zebra rows, shaded first (as in Wetware docs). */
  table { width: 100%; border-collapse: collapse; margin: 6pt 0 12pt 0; font-size: 9.5pt; line-height: 1.4; }
  th, td { text-align: left; vertical-align: top; padding: 5pt 8pt; }
  /* Each filled cell casts a 1px shadow of its own fill to both sides. PDF viewers (Preview) anti-alias the edge
     where two cells' fills meet, which shows as a hairline break in a filled row; the overlapping shadows leave
     no edge there. Shadows don't take up space, so the layout is unchanged. */
  th { font-weight: 600; background: var(--ink); color: #fff; padding-top: 6pt; padding-bottom: 6pt;
       box-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
  tbody tr:nth-child(odd) td { background: #f5f5f5; box-shadow: 1px 0 0 #f5f5f5, -1px 0 0 #f5f5f5; }
  /* md2html.py classes markdown tables by column count. */
  table.cols2 th, table.cols2 td { width: 50%; }
  table.cols4 th:first-child, table.cols4 td:first-child { width: 20%; }
  table.cols4 td:first-child { color: var(--muted); font-weight: 600; }
  table.cols4 td:first-child strong { color: var(--ink); }

  /* Quote components, for an HTML body (see example-quote.html). */
  /* Quote details under the title, no table: who it's for on the left, quote number and date on the right. */
  .quote-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 24pt;
                margin: 2pt 0 4pt 0; font-size: 10pt; line-height: 1.5; }
  .quote-meta p { margin: 0; }
  .quote-meta .numbers { text-align: right; }
  .meta-label { font-weight: 600; color: var(--muted); }
  table.scope td:first-child { width: 24%; font-weight: 600; }
  table.price th:last-child, table.price td:last-child { width: 22%; text-align: right; white-space: nowrap; }
  /* Total row: gray fill with a 1.5px rule above it. The rule is one bar across the whole table (the first
     cell's ::before, positioned against the table), not a border per cell: per-cell borders leave a break
     where the cells meet in Preview. It sits at the bar's static spot (the cell's content top), pulled up
     by the cell's top padding plus its own height. */
  table.price { position: relative; }
  table.price tr.total td { background: #eeeeee; font-weight: 600; padding-top: 7pt;
                            box-shadow: 1px 0 0 #eeeeee, -1px 0 0 #eeeeee; }
  table.price tr.total td:first-child::before { content: ""; position: absolute; left: 0; right: 0;
    height: 1.5px; margin-top: calc(-7pt - 1.5px); background: var(--ink); }
  table.timeline td:first-child { width: 18%; color: var(--muted); font-weight: 600; }
  .note { font-size: 9pt; color: var(--muted); }
  .check { margin: 0 0 6pt 0; }
  table.sign { margin: 6pt 0 0 0; }
  table.sign td, table.sign tbody tr:nth-child(odd) td { background: none; box-shadow: none; width: 50%; padding: 0 24pt 0 0; }
  .line { border-bottom: 1px solid #999; height: 22pt; margin-bottom: 3pt; }
  .label { font-size: 8.5pt; color: var(--muted); }

  /* pagination */
  h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
  p, li, tr { break-inside: avoid; page-break-inside: avoid; }
  thead { display: table-header-group; }
  p, li { orphans: 3; widows: 3; }
  .keep { break-inside: avoid; page-break-inside: avoid; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
